name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: "Validate Banca Site & Build"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-banca:latest
    steps:
      - uses: actions/checkout@v4
      - name: "Verify Essential Files & Build"
        run: |
          test -f .gost/GOST.md || { echo ".gost/GOST.md missing"; exit 1; }
          cccp hook -i
          cccp check --strict
          black --check scripts/ || true
          ./tests/test-ci-hooks-install.sh
          test -f README.md || { echo "README.md missing"; exit 1; }
          test -f LICENSE || { echo "LICENSE missing"; exit 1; }
          test -f VERSION || { echo "VERSION missing"; exit 1; }
          test -f site/_headers || { echo "site/_headers missing"; exit 1; }
          sh -n build.sh || { echo "Syntax error in build.sh"; exit 1; }
          ./build.sh
          test -f site/index.html || { echo "site/index.html missing after build"; exit 1; }
          python3 scripts/gerar-pratilera.py
          ./tests/test-pratilera.sh
          echo "All essential files, static build and Pratilera F-Droid store validated successfully."

  deploy-site:
    name: "Publish Banca Site Bundle to Generic Packages"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-banca:latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Build Site & Regenerate Pratilera Catalog"
        run: |
          ./build.sh
          python3 scripts/gerar-pratilera.py
      - name: "Upload Site Bundle for Kombinat"
        env:
          GAMBI_2LP_IN_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.FORGEJO_TOKEN || secrets.GIT_2LP_TOKEN }}
        run: |
          cccp package upload site
