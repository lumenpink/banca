name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: "Validate Banca Site & Build"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-banca:latest
    steps:
      - uses: actions/checkout@v4
      - name: "Verify Essential Files & Build"
        run: |
          test -f GOSTVER || { echo "GOSTVER missing"; exit 1; }
          test -f README.md || { echo "README.md missing"; exit 1; }
          test -f LICENSE || { echo "LICENSE missing"; exit 1; }
          test -f VERSION || { echo "VERSION missing"; exit 1; }
          test -f site/_headers || { echo "site/_headers missing"; exit 1; }
          sh -n build.sh || { echo "Syntax error in build.sh"; exit 1; }
          ./build.sh
          test -f site/index.html || { echo "site/index.html missing after build"; exit 1; }
          python3 scripts/gerar-pratilera.py
          ./tests/test-pratilera.sh
          echo "All essential files, static build and Pratilera F-Droid store validated successfully."

  deploy-site:
    name: "Deploy Documentation Site"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-banca:latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            attempt=1
            max_attempts=4
            delay=5
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "  -> Deploying to Cloudflare (tentativa $attempt/$max_attempts)..."
              if npx wrangler deploy; then
                echo "  ✓ Deploy do site da Banca concluído com sucesso."
                exit 0
              fi
              echo "  ⚠️ Falha transitória ao fazer deploy. Aguardando ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
            echo "❌ ERRO CRÍTICO: Falha permanente após $max_attempts tentativas no deploy do site da Banca."
            exit 1
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi
